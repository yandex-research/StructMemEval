## Full benchmark config
## mem0 RAG → gpt-4o, mem0 Agent → gemini-3-flash, mem-agent → gemini-3-pro
## Usage: python benchmark.py --config config.yaml

# === Memory Systems ===
mem0:
  llm:
    provider: openai
    model: gpt-4o-mini
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_BASE_URL}
    
  embedder:
    provider: openai
    model: text-embedding-3-large
    api_key: ${OPENAI_API_KEY}
    embedding_dims: 3072
    openai_base_url: ${OPENAI_BASE_URL}
    
  vector_db:
    provider: qdrant
    path: ./qdrant_data
    embedding_model_dims: 3072

mem_agent:
  model: gpt-4o-mini
  api_key: ${OPENAI_API_KEY}
  base_url: ${OPENAI_BASE_URL}
  memory_path: memory_mem_agent

# === Experiments ===
experiments:
  - name: gemini-3.1-flash
    model: google/gemini-3.1-flash-lite-preview
    api_key: ${LLM_PROVIDER_API_KEY}
    base_url: ${LLM_PROVIDER_BASE_URL}
    data_dirs:
      - benchmark/data/accounting
    run:
      mem0_rag:
        limits: [5, 20]
        infer: [false]


# === Execution ===
max_cases: null
parallel_workers: 2
auto_clean_memory: false
output_dir: eval_results
verbose: false
