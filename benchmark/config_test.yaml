## Quick test config — first 6 cases, all memory systems
## Usage: python benchmark.py --config config_test.yaml

# === Memory Systems ===
mem0:
  llm:
    provider: openai
    model: gpt-4o-mini
    api_key: ${OPENAI_API_KEY}
  embedder:
    provider: openai
    model: text-embedding-3-large
    api_key: ${OPENAI_API_KEY}
    embedding_dims: 3072
  vector_db:
    provider: qdrant
    path: ./qdrant_data_test
    embedding_model_dims: 3072

mem_agent:
  model: gpt-4o-mini
  api_key: ${OPENAI_API_KEY}
  memory_path: memory_test

# === Experiments ===
experiments:
  - name: gpt-4o-mini
    data_dirs:
      - data/state_machine_location/
    run:
      mem0_rag:
        limits: [5]
        infer: [false]
      mem0_agent:
        iterations: 5
        search_limit: 50
      mem_agent: {}

# === Execution ===
max_cases: 6
parallel_workers: 1
auto_clean_memory: true
output_dir: eval_results_test
verbose: false
